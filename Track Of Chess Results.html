<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Status Of Queens 'N' ð Results</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #edf4ff;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 4fr 1fr;
            min-height: 100vh;
        }

        .side {
            background: #dbe8ff;
        }

        .main {
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #23395d;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        #createRowBtn {
            background: #4caf50;
            color: white;
        }

        #kingBtn {
            background: #d32f2f;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #304ffe;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }

        .thoa {
            background: #fff8e1;
        }

        .yao {
            background: #e8f5e9;
        }

        .sofia {
            background: #f3e5f5;
        }

        .blank {
            background: darkorange;
        }

        .note {
            font-size: 12px;
            color: darkgreen;
            display: inline-block;
        }

        .history {
            margin-top: 8px;
            min-height: 24px;
            font-weight: bold;
            color: #0d47a1;
            word-break: break-word;
        }

        .controlRow {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }

        select {
            padding: 5px;
        }

        .addResultBtn {
            background: #1976d2;
            color: white;
        }

        .locked {
            opacity: .5;
            pointer-events: none;
        }

        #kingStatus {
            margin-top: 10px;
            font-weight: bold;
            color: #c62828;
        }

        .right-align {
            margin-left: 700px;
        }
    </style>
</head>

<body>

    <div class="layout">
        <div class="side"></div>
        <div class="main">
            <h1>♔ Queens' Status 'N' Ending Result Tracker ♔</h1>

            <div class="section">
                <button id="createRowBtn">
                    Add Queen Row
                </button>
                <div class="note right-align">there's only 3 queens. always.</div>
            </div>
            <div class="section">
                <table>
                    <thead>
                        <tr>
                            <th>Nam Cung Hoàng Hậu</th>
                            <th>Đông Cung Hoàng Hậu</th>
                            <th>Tây Cung Hoàng Hậu</th>
                            <th>Bắc Cung Hoàng Hậu</th>
                        </tr>
                    </thead>
                    <tbody id="queenBody">
                    </tbody>
                </table>
            </div>
            <div class="section">
                <button id="kingBtn">
                    King Endly Checked
                </button>
                <div id="kingStatus"></div>
            </div>
        </div>
        <div class="side"></div>
    </div>

    <script>
        let rowCounter = 0;
        const queenBody =
            document.getElementById("queenBody");

        function saveState() {
            localStorage.setItem("davios_rows", queenBody.innerHTML);
            localStorage.setItem("davios_counter", rowCounter);
            localStorage.setItem("davios_king_status",
                document.getElementById("kingStatus").innerHTML
            );
        }

        function loadState() {
            const rows = localStorage.getItem("davios_rows");
            if (rows) queenBody.innerHTML = rows;

            rowCounter = parseInt(localStorage.getItem("davios_counter") || "0");
            document.getElementById("kingStatus").innerHTML = localStorage.getItem("davios_king_status") || "";
            rebindButtons();
            checkLock();
        }

        function getQueenOrder() {
            rowCounter++;
            let ret;

            switch (rowCounter%3) {    
                case 0:
                    ret = [["Thoa Nguyen", "thoa"], 
                        ["Annabel Yield /diêu/", "yao"], 
                        ["Infanta Sapphire", "sofia"], 
                        ["", "blank"]];
                    break;

                case 1:
                    ret = [["Lý Bèo", "thoa"], 
                        ["Sofía ð Todos ðɪ B'orbón", "sofia"], 
                        ["姚安娜", "yao"], 
                        ["", "blank"]];
                    break;

                case 2:
                    ret = [["Tigress Kim_thoa", "thoa"], 
                        ["Sofia Princess of Spain", "sofia"], 
                        ["Anna Giang", "yao"], 
                        ["", "blank"]];
                    break;

                default:
                    break;
            }
            return ret;
        }

        function createQueenCell(name, cssClass, isPeopleHere = true) {
            if (isPeopleHere) {
                
            return `
                <td class="${cssClass}">
                    <strong>${name}</strong>
                    <div class="history"></div>            
                    <div class="controlRow">
                        <select>
                            <option value="default">
                                Select Result
                            </option>
                            <option value="loss">
                                Loss
                            </option>
                            <option value="koe">
                                Win
                            </option>
                            <option value="koe">
                                Draw
                            </option>
                        </select>
                        <button
                            class="addResultBtn">
                            Add
                        </button>
                    </div>
                </td>`;
            }
            else
            {
                return `<td class="${cssClass}"></td>`;
            }
        }

        function addRow() {
            const order = getQueenOrder();
            const tr = document.createElement("tr");

            tr.innerHTML = createQueenCell(order[0][0], order[0][1]) +
                createQueenCell(order[1][0], order[1][1]) +
                createQueenCell(order[2][0], order[2][1]) +
                createQueenCell(order[3][0], order[3][1], false);
            queenBody.appendChild(tr);
            rebindButtons();

            saveState();
        }

        function rebindButtons() {
            document.querySelectorAll(".addResultBtn").forEach(btn => {
                if (btn.dataset.bound)
                    return;

                btn.dataset.bound = "1";
                btn.addEventListener("click", () => {
                    const td = btn.closest("td");
                    const history = td.querySelector(".history");
                    const select = td.querySelector("select");
                    const current = history.textContent.trim();
                    let items = current ? current.split(" ") : [];

                    
                    if (select.value === "default") {
                        // alert("Please select a valid result.");
                        return;
                    }

                    if (select.value === "koe") {
                        items.push("kỏe");
                    } else {
                        // let maxLoss = 0;

                        // items.forEach(x => {
                        //     const n = parseInt(x);

                        //     if (!isNaN(n)) maxLoss = Math.max(maxLoss, n);
                        // });
                        items.push(items.length + 1);
                    }

                    history.textContent = items.join(" ");

                    if (items.length == 4) {
                        td.classList.add("locked");
                    }

                    saveState();
                });
            });
        }

        function lockControls() {
            queenBody.classList.add("locked");
        }

        function unlockControls() {
            queenBody.classList.remove("locked");
        }

        function checkLock() {
            const resume = localStorage.getItem("davios_resume");

            if (!resume) {
                unlockControls();
                return;
            }

            const now = new Date();
            const resumeDate = new Date(resume);

            if (now < resumeDate) {
                lockControls();
            } else {
                unlockControls();
                localStorage.removeItem("davios_resume");
            }
        }

        document.getElementById("createRowBtn").addEventListener("click", addRow);
        document.getElementById("kingBtn").addEventListener("click", () => {
            const now = new Date();
            const resume = new Date(now.getTime() + 4 * 24 * 60 * 60 * 1000);

            localStorage.setItem("davios_resume", resume.toISOString());
            document.getElementById("kingStatus").innerHTML =
                `
                            Checked:
                            ${now.toLocaleString()}
                            <br><br>
                            Resume:
                            ${resume.toLocaleDateString()}
                        `;
            lockControls();
            saveState();
        }
        );

        loadState();
    </script>

</body>

</html>
