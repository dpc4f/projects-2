<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Status Of Queens 'N' ð Results</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #edf4ff;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 4fr 1fr;
            min-height: 100vh;
        }

        .side {
            background: #dbe8ff;
        }

        .main {
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #23395d;
            margin-top: -10px;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        #createRowBtn {
            background: #4caf50;
            color: white;
        }

        #kingBtn {
            background: #d32f2f;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #304ffe;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }

        .thoa {
            background: #fff8e1;
        }

        .yao, .sofia-1 {
            background: #e8f5e9;
        }

        .yao-1, .sofia {
            background: #f3e5f5;
        }

        .blank {
            background: darkorange;
        }

        .note {
            font-size: 12px;
            color: darkgreen;
            display: inline-block;
        }

        .history {
            min-height: 24px;
            font-weight: bold;
            color: #0d47a1;
            word-break: break-word;
        }

        .controlRow {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        select {
            padding: 5px;
        }

        .addResultBtn {
            background: #1976d2;
            color: white;
        }

        .locked {
            opacity: .5;
            pointer-events: none;
        }

        #kingStatus {
            margin-top: 10px;
            font-weight: bold;
            color: #c62828;
        }

        .right-align {
            margin-left: 700px;
        }

        .invisible, .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="layout">
        <div class="side"></div>
        <div class="main">
            <h1>♔ Queens' Status 'N' Ending Result Tracker ♔</h1>

            <div class="section">
                <button id="createRowBtn">
                    Add Queen Row
                </button>
                <div class="note right-align">there's only 3 queens. always.</div>
            </div>
            <div class="section">
                <table>
                    <thead>
                        <tr>
                            <th>Nam Cung Hoàng Hậu</th>
                            <th>Đông Cung Hoàng Hậu</th>
                            <th>Tây Cung Hoàng Hậu</th>
                            <th>Bắc Cung Hoàng Hậu</th>
                        </tr>
                    </thead>
                    <tbody id="queenBody">
                    </tbody>
                </table>
            </div>
            <div class="section">
                <button id="kingBtn">
                    King Endly Checked
                </button>
                <div id="kingStatus"></div>
                <div class="note right-align hidden">The King, A Horcrux Of Great { Bee Emperor, Ant King }</div>
            </div>
        </div>
        <div class="side"></div>
    </div>

    <script>
        let rowCounter = 0;
        const queenBody = document.getElementById("queenBody");

        function saveState() {
            localStorage.setItem("davios_rows", queenBody.innerHTML);
            localStorage.setItem("davios_counter", rowCounter);
            localStorage.setItem("davios_king_status",
                document.getElementById("kingStatus").innerHTML
            );
        }

        function loadState() {
            
            /*** 
                [; nr] fix the bug to resume David the King when time being endly checked is over <-- done
            */

            const rows = localStorage.getItem("davios_rows");
            if (rows) queenBody.innerHTML = rows;
            rowCounter = parseInt(localStorage.getItem("davios_counter") || "0");

            let status = localStorage.getItem("davios_king_status");
            const ARR = status.trim().split(/\s+/);
            document.getElementById("kingStatus").innerHTML = status || "";
            
            if (ARR.length > 5) { // do check if passing 4 days from being checked endly
                let date = new Date(ARR[ARR.length-1]);
                const TODAY = new Date();
                
                if (TODAY >= date) // clear the message
                    document.getElementById("kingStatus").innerHTML = "";
            }

            rebindButtons();
            checkLock();
        }

        function getQueenOrder() {
            let ret;
            let order = playTheDice(10);
            let dao = rowCounter % 2 == 0 ? 'yao' : 'yao-1';
            let sofıa = rowCounter % 2 == 0 ? 'sofia' : 'sofia-1'

            switch (order) {    
            
                /***
                 * 
                 * Narana Erdyneeva (Нарана Эрдынеева), queen Annabel Yao's subordinate
                 * Narana Erdyneeva (Đắc Kỷ), thuộc cấp của bél Anna
                 * 
                 */

                case 0:
                    ret = [["Tigress Kim_thoa", "thoa"], 
                        // ["Anna Giang", "yao"], 
                        ["Naran Erdyneeva (Нарана Эрдынеева)", dao], 
                        ["Infanta Sofı'a Of Spain", sofıa], 
                        ["", "blank"]];
                    break;
                
                case 1:
                    ret = [["Thoa Nguyen", "thoa"], 
                        // ["Annabel Yield /diêu/", "yao"], 
                        ["Diamond eXecution Concubine 'Naran Erdyneeva'", dao],
                        ["Infanta Sapphire", sofıa], 
                        ["", "blank"]];
                    break;

                case 2:
                    ret = [["Lý Bèo", "thoa"], 
                        ["Sofía ð Todos ðɪ B'orbón", sofıa], 
                        // ["姚安娜", "yao"], 
                        ["Nữ Báu 'Châu Kris'", dao],
                        ["", "blank"]];
                    break;

                case 8:
                    ret = [["Xà /tho/ Rắn Yêu", "thoa"], 
                        ["Công Chúa Bong Bóng", sofıa], 
                        // ["Beo 'Anna Yao'", "yao"], 
                        ["Нарана Эрдынеева ð Bee", dao],
                        ["", "blank"]];
                    break;

                case 4:
                    ret = [["Tigress Kim_thoa", "thoa"], 
                        // ["Anna Giang", "yao"], 
                        ["Naran Erdyneeva (Нарана Эрдынеева)", dao], 
                        ["Infanta Sofı'a Of Spain", sofıa], 
                        ["", "blank"]];
                    break;

                case 5:
                    ret = [["Thoa Nguyen", "thoa"], 
                        // ["Anna Giang", "yao"], 
                        ["Эрдынеева (Châu Kris ð Mouse)", dao], 
                        ["Princesa Sofia", sofıa], 
                        ["", "blank"]];
                    break;

                case 6:
                    ret = [["Lý Bèo", "thoa"],
                        ["Infanta Sapphire", sofıa], 
                        // ["Anna Giang", "yao"],
                        ["Naran Erdyneeva (Нарана Эрдынеева)", dao], 
                        ["", "blank"]];
                    break;

                case 7:
                    ret = [["Xà /tho/ Rắn Yêu", "thoa"], 
                        // ["Anna Giang", "yao"], 
                        ["Нарана Эрдынеева ð Bee", dao], 
                        ["Béo Sofı'a", sofıa], 
                        ["", "blank"]];
                    break;

                case 3:
                    ret = [["Tigress Kim_thoa", "thoa"], 
                        ["Sofı'a los Santos y Ortiz", sofıa], 
                        // ["Anna Giang", "yao"], 
                        ["Diamond Invaluable Koncubine Narana", dao], 
                        ["", "blank"]];
                    break;

                case 9:
                    ret = [["Mèo Béo Thoa", "thoa"], 
                        // ["Anna Giang", "yao"], 
                        ["Naran Erdyneeva ð Bee", dao], 
                        ["Sofıa ð Todos ð Borbón", sofıa],
                        ["", "blank"]];
                    break;

                default:
                    /* not explicitly exposed to the others [cim, Clever Internal Wives] */
                    ret = [["Thoa", "thoa"], 
                        ["Sofía", "sofia"], 
                        ["Annabel", "yao"], 
                        ["", "blank"]];
                    break;
            }
            rowCounter++;
            
            return ret;
        }

        function createQueenCell(name, cssClass, isPeopleHere = true) {
            if (isPeopleHere) {
                
            return `
                <td class="${cssClass}">
                    <strong>${name}</strong>
                    <div class="history"></div>            
                    <div class="controlRow">
                        <select>
                            <option value="default">
                                Select Result
                            </option>
                            <option value="loss">
                                Loss
                            </option>
                            <option value="koe">
                                Win
                            </option>
                            <option value="koe">
                                Draw
                            </option>
                        </select>
                        <button
                            class="addResultBtn">
                            Add
                        </button>
                    </div>
                </td>`;
            }
            else
            {
                return `<td class="${cssClass}"></td>`;
            }
        }

        function addRow() {

            /***
             * [; nr] update the algorithm 4 a randomizing
             *
             */ // --> done

            const order = getQueenOrder();
            const tr = document.createElement("tr");
            const RET = playTheDice(2); // once; to define which queen will make a move first

            if (RET) {
                tr.innerHTML = createQueenCell(order[0][0], order[0][1]) +
                    createQueenCell(order[1][0], order[1][1]) +
                    createQueenCell(order[2][0], order[2][1]) +
                    createQueenCell(order[3][0], order[3][1], false);
            } else {
                tr.innerHTML = createQueenCell(order[0][0], order[0][1]) +
                    createQueenCell(order[2][0], order[2][1]) +
                    createQueenCell(order[1][0], order[1][1]) +
                    createQueenCell(order[3][0], order[3][1], false);
            }
            
            queenBody.appendChild(tr);
            rebindButtons();
            saveState();
        }

        function playTheDice(modulo) { /* play the dice once only */
            let now = new Date();
            let sec = now.getSeconds();
            
            return ((sec+19)*3)%modulo;
        }

        function rebindButtons() {
            document.querySelectorAll(".addResultBtn").forEach(btn => {
                if (btn.dataset.bound)
                    return;

                btn.dataset.bound = "1";
                btn.addEventListener("click", () => {
                    const td = btn.closest("td");
                    const history = td.querySelector(".history");
                    const select = td.querySelector("select");
                    const current = history.textContent.trim();
                    let items = current ? current.split(" ") : [];

                    
                    if (select.value === "default") {
                        // alert("Please select a valid result.");
                        return;
                    }

                    if (select.value === "koe") {
                        items.push("kỏe");
                    } else {
                        // let maxLoss = 0;

                        // items.forEach(x => {
                        //     const n = parseInt(x);

                        //     if (!isNaN(n)) maxLoss = Math.max(maxLoss, n);
                        // });
                        items.push(items.length + 1);
                    }

                    history.textContent = items.join(" ");

                    if (items.length == 4) {
                        td.classList.add("locked");
                    }

                    saveState();
                });
            });
        }

        function lockControls() {
            queenBody.classList.add("locked");
        }

        function unlockControls() {
            queenBody.classList.remove("locked");
        }

        function checkLock() {
            const resume = localStorage.getItem("davios_resume");

            if (!resume) {
                unlockControls();
                return;
            }

            const now = new Date();
            const resumeDate = new Date(resume);

            if (now < resumeDate) {
                lockControls();
            } else {
                unlockControls();
                localStorage.removeItem("davios_resume");
            }
        }

        document.getElementById("createRowBtn").addEventListener("click", addRow);
        document.getElementById("kingBtn").addEventListener("click", () => {
            const now = new Date();
            const resume = new Date(now.getTime() + 4 * 24 * 60 * 60 * 1000);

            localStorage.setItem("davios_resume", resume.toISOString());
            document.getElementById("kingStatus").innerHTML =
                `
                            Checked:
                            ${now.toLocaleString()}
                            <br><br>
                            Resume:
                            ${resume.toLocaleDateString()}
                        `;
            lockControls();
            saveState();
        }
        );

        loadState();
    </script>

</body>
</html>
