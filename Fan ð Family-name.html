<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fan &lt;--&gt; { Phan, Phạm }</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #name {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 2px;
            width: 500px; /* your added constraint */
        }

        .dot {
            display: inline-block;
            width: 0.6ch; /* reserve space */
            text-align: center;
            margin-left: -26px;
          
        }

        .tail {
            display: inline-block;
            width: 1ch;
            margin-left: -31px;
        }

        .last-char {
            display: inline-block;
            margin-left: 12px;
        }

        .letter {
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif, system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .letter-U {
            font-size: 50px;
            top: 0;
            position: relative;
        }

        .container {
            display: inline-block;
            position: relative;
        }

        .breve {
            position: absolute;
            top: -1px;
            left: 28%;
            transform: translateX(-55%);
            font-size: 45px;
            transform-origin: center center;
            display: inline-block;
            width: auto;
            height: 20px;
        }

        .char {
            font-size: 50px;
            display: inline-block;
        }

        .rotate-U {
            display: inline-block;
            transform-origin: center;
            animation: rotateU 4s infinite ease-in-out;
        }

        .rotate-breve {
            display: inline-block;
            transform-origin: center;
            animation: rotateBreve 4s infinite ease-in-out;
        }

        #rotation {
            position: absolute;
            left: 1100px;
            top: 600px;
        }

        @keyframes rotateBreve {
            0% {
                transform: rotateX(0deg) translateY(0);
            }
            50% {
                transform: rotateX(180deg) translateY(-2px);
            }
            100% {
                transform: rotateX(360deg) translateY(0);
            }
        }

        @keyframes rotateU {
            0% {
                transform: rotateX(360deg) scale(1);
            }
            50% {
                transform: rotateX(-0deg);
            }
            100% {
                transform: rotateX(180deg) translateY(-10px);
            }
        }
    </style>
</head>

<body>
    <div id="name">
        { Fan, Ph<span id="a">a</span>
        <span class="dot" id="dot"></span>
        <span class="tail" id="tail">n</span> 
        <span class="last-char">}</span> 
    </div>
    <div id="rotation">
         <span class='letter'>Con Tr</span> 
        <div class="container">
            <span class="letter breve rotate-breve">˘</span>
            <span class="letter">a</span>
        </div>
        <span class='letter letter-U rotate-U'>ᴜ</span>
    </div>

    <script>
        const dotEl = document.getElementById("dot");
        const tailEl = document.getElementById("tail");
        let dotOn = false;
        let isM = false;

        // Dot accent (̣) toggles every 500ms
        setInterval(() => {
            dotOn = !dotOn;
            dotEl.textContent = dotOn ? "\u0323" : ""; // combining dot below
        }, 2200);

        // n <-> m toggles every 800ms (different rhythm)
        setInterval(() => {
            isM = !isM;
            tailEl.textContent = isM ? "m" : "n";
        }, 1500);
    </script>

</body>
</html>
