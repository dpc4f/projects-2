<html lang="en">
<head>
  <title>Flexbox: The flex-direction property</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="../code-pen.css">
</head>

<body>

<main>
  <div class="wrapper">
    <article class="flow">
      <h1>Wrapped flex lines</h1>
      <figure class="callout">
        <p>
          In this example the flex container has <code>flex-wrap: wrap</code> so the
          flex items display at max-content size and wrap onto new lines.
        </p>
      </figure>
      <div class="controls">
        <label class="toggle" for="flexWrap">
          <span class="toggle__label">Toggle flex wrapping off/on</span>
          <input type="checkbox" role="switch" class="toggle__element" id="flexWrap" checked />
          <div class="toggle__decor" aria-hidden="true">
            <div class="toggle__thumb"></div>
          </div>
        </label>
      </div>
      <div class="container" id="container">
        <div class="box">Item One</div>
        <div class="box">Item Two</div>
        <div class="box">Item Three</div>
        <div class="box">Item Four</div>
        <div class="box">Item Five, with longer text</div>
        <div class="box">Item Six</div>
      </div>
    </article>
  </div>
</main>

    <script src="script.js"></script>
</body>

</html>
