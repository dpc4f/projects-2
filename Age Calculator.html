<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background: #f9f9f9;
        }

        .buttonCalculate {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .buttonCalculate:hover {
            background: #764ba2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 18px;
        }

        h2 {
            margin: 5px 0;
            font-size: 18px;
        }

        .center {
            text-align: center;
            margin-top: 40px;

        }

        h1 {
            margin: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            margin-top: 40px;
        }

        .convertToElte {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            margin-bottom: 50px;
        }

        #reference {
            font-size: 17px;
        }

        #result {
            font-size: 22px;
            color: #333;
            margin-top: 10px;
        }

        #raw-date {
            width: 100%;
            left: 240px;
            position: relative;
        }

        #gregorianDOB {
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        #D-label {
            display: inline-block;
            margin-right: 0;
        }

        .convertToElte {
            text-align: center;
            display: block;
            left: 95px;
            position: relative;
        }

        h3 {
            margin-bottom: 0px;
        }

        .note {
            font-size: 14px;
            color: darkgreen;
           
        }

        .align-right {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="center">Age Calculator</h1>
        <div>
            <h3 class="center">Date Of Birth In Gregorian Calendar</h3>
            <div id="raw-date">
                <input id="gregorianDOB" oninput="checkValues()" onchange="checkValues()" value="Dec 13 2011">
                <div id="D-label"></div>
                <button class="convertToElte" onclick="convertToElte()">COPYpaste</button>
            </div>
            <div class="note">Note: Time of a day in seconds may vary depending on situations 
                like seasons on Earth; sun operations; moon's affections; other stars; meteors gravitational co-attraction; etc.</div>
        </div>

        <input type="text" id="birthDate" placeholder="Input your birth date">
        <button class="buttonCalculate" onclick="calculateAge()">Calculate Age</button>

        <div id="result"></div>
        <h4 id="reference"></h4>
        <div class="note align-right">Tú Sỉ Dèo Mận Thì Tịn Ngụi Mò Dận Thâu Tới Huật</div>
    </div>

    <script>
        const CURRENT_YEAR = 2020;
        const TODAY = new Date();
        const DAYS_IN_YEAR = 365.25;        
        const MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const MONTH_NAMES_2 = [
            "Athen", "Duo", "Magha", "Qaru", "Felle", "Yune",
            "SEPT", "OCT", "NOV", "DEC", "Palm", "Hose"
        ]; // Athen is a goddess, wife of Zeus

        let currentMonth = TODAY.getMonth();
        let currentYear = TODAY.getFullYear();

        /****
         * [] fix a bug Jan converted to Athen
         * 
         * 
        */ // --> done

        function convertCurrentYear() {
            let subtract = currentYear - CURRENT_YEAR;
            return 'current_year+' + subtract.toString();
        }

        function convertReversedCurrentYear(yearStr, addOneYear = false) {
            const match = yearStr.match(/^current_year([+-]\d+)$/);
            
            return CURRENT_YEAR + Number(match?.[1] ?? 0) + (addOneYear ? 1 : 0);
        }

        function toTuesdayFirst(day) {
            return (day + 5) % 7;
        }

        function renderCalendar(year, month) {
            document.getElementById("monthYear").textContent =
                MONTH_NAMES_2[month] + " " + convertCurrentYear(year);

            const firstDay = new Date(year, month, 1);
            const startIndex = toTuesdayFirst(firstDay.getDay());
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const body = document.getElementById("calendarBody");
            body.innerHTML = "";

            let date = 1;

            for (let r = 0; r < 6; r++) {
                const row = document.createElement("tr");

                for (let c = 0; c < 7; c++) {
                    const cell = document.createElement("td");

                    if (r === 0 && c < startIndex || date > daysInMonth) {
                        cell.textContent = "";
                    } else {
                        cell.textContent = date;

                        if (
                            date === TODAY.getDate() &&
                            month === TODAY.getMonth() &&
                            year === TODAY.getFullYear()
                        ) {
                            cell.classList.add("TODAY");
                        }

                        date++;
                    }

                    row.appendChild(cell);
                }

                body.appendChild(row);
                if (date > daysInMonth) break;
            }
        }

        function changeMonth(step) {
            currentMonth += step;

            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }

            renderCalendar(currentYear, currentMonth);
        }

        function checkValues() {
            const gregorianDOB = document.getElementById('gregorianDOB').value;
            const date = new Date(gregorianDOB);

            if (isNaN(date.getTime()))
                return;

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let checkbox = document.getElementById('injectedCheckbox');
            
            if (month == 10 && day == 27 && year == 1982)
                checkbox.checked = true;
            else
                checkbox.checked = false;
        }

        function calculateAge() {
            const birthDate = document.getElementById('birthDate').value;
            const resultDiv = document.getElementById('result');

            if (!birthDate) {
                resultDiv.textContent = 'Please enter a birth date';
                return;
            }

            const arr = birthDate.trim().split(/\s+/);
            const m = MONTH_NAMES_2.indexOf(arr[0]);

            if (m === -1 || arr.length < 3) {
                resultDiv.textContent = 'Please use the format "M11 1 current_year±N"';
                return;
            }

            const birthMonthName = MONTH_NAMES[m];     
            const birthYear = convertReversedCurrentYear(arr[2], m < 2);
            const convertedBirthDate = `${birthMonthName} ${arr[1]} ${birthYear}`;

            const TODAY = new Date();
            const birth = new Date(convertedBirthDate);
            if (isNaN(birth.getTime())) {
                resultDiv.textContent = 'Invalid birth date format';
                return;
            }

            let dayDiff = Math.floor((TODAY.getTime() - birth.getTime()) / (1000 * 60 * 60 * 24));

            resultDiv.textContent = `You are ${dayDiff.toLocaleString()} days old`;
            document.getElementById('reference').textContent = '~' + (dayDiff / DAYS_IN_YEAR).toFixed(2) + ' years old';
        }

        function convertToElte() {
            const gregorianDOB = document.getElementById('gregorianDOB').value;
            const date = new Date(gregorianDOB);

            if (isNaN(date.getTime())) {
                alert('Invalid date format. Please use a format like "Dec 13 2011".');
                return;
            }

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let bFromDavid = false;

            // check whether { month w/ day } are David's
            let decheck = document.getElementById('injectedCheckbox');
            bFromDavid = decheck.checked;

            let elteMonth = !bFromDavid ? MONTH_NAMES_2[month < 2 ? month+10 : month-2] : MONTH_NAMES_2[month];
            let elteYear;
            let elteDOB;

            if (bFromDavid == true) 
                year -= 2;
            else if (month < 2) // month is Jan OR Feb
                year--;
            
            if (year > CURRENT_YEAR)
                elteYear = 'current_year+' + (year - CURRENT_YEAR).toString();
            else if (year < CURRENT_YEAR)
                elteYear = 'current_year-' + (CURRENT_YEAR - year).toString();
            else
                elteYear = 'current_year';
            
            elteDOB = `${elteMonth} ${day} ${elteYear}`;
            document.getElementById('birthDate').value = elteDOB;
        }

        function injectCheckbox(targetElementId) {
            const container = document.createElement('label');
            container.style.cssText = 'display: inline-flex; align-items: center; cursor: pointer; font-size: 13px; font-family: sans-serif; gap: 4px';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'injectedCheckbox';
            checkbox.style.cssText = 'cursor: pointer; width: 15px; height: 15px;';

            const label = document.createElement('span');
            label.textContent = 'Do A Flip';

            checkbox.addEventListener('change', (e) => {
                console.log(`Checkbox state: ${e.target.checked}`);
            });

            container.appendChild(checkbox);
            container.appendChild(label);

            const target = document.getElementById(targetElementId) || document.body;
            target.appendChild(container);
        }

        window.onload = function() {
            injectCheckbox('D-label'); // Call the function to inject into document.body or a specific container ID
        }
    </script>

</body>
</html>
