<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background: #f9f9f9;
        }

        .buttonCalculate {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .buttonCalculate:hover {
            background: #764ba2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 18px;
        }

        h2 {
            margin: 5px 0;
            font-size: 18px;
        }

        .center {
            text-align: center;
            margin-top: 40px;

        }

        h1 {
            margin: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            margin-top: 40px;
        }

        .convertToElte {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            margin-bottom: 50px;
        }

        #reference {
            font-size: 17px;
        }

        #result {
            font-size: 22px;
            color: #333;
            margin-top: 10px;
        }

        #raw-date {
            width: 100%;
            left: 240px;
            position: relative;
        }

        #gregorianDOB {
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        #D-label {
            display: inline-block;
            margin-left: 10px;
            margin-top: 20px;
            position: absolute;
        }

        .convertToElte {
            text-align: center;
            display: block;
            left: 95px;
            position: relative;
        }

        h3 {
            margin-bottom: 0px;
        }

        .note {
            font-size: 14px;
            color: darkgreen;
           
        }

        .align-right {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="center">Age Calculator</h1>
        <div>
            <h3 class="center">Date Of Birth In Gregorian Calendar</h3>
            <div id="raw-date">
                <input id="gregorianDOB" oninput="checkValues()" onchange="checkValues()" value="Dec 13 2011">
                <div id="D-label"></div>
                <button class="convertToElte" onclick="copyPASTE()">COPYpaste</button>
            </div>
            <div class="note">Note: a day's duration [in seconds] may vary depending on situations 
                like seasons on Earth; sun operations; moon's affections; other stars; meteors gravitational co-attraction; etc.</div>
        </div>

        <input type="text" id="birthDate" placeholder="Input your birth date">
        <button class="buttonCalculate" onclick="calculateAge()">Calculate Age</button>

        <div id="result"></div>
        <h4 id="reference"></h4>
        <div class="note align-right">Tú Sỉ Dèo Mận Thì Tịn Ngụi Mò Dận Thâu Tới Huật</div>
    </div>

    <script src='Re-used Components.js'></script>

    <script>     

        // Athen is a goddess, wife of Zeus

        let currentMonth = TODAY.getMonth();
        let currentYear = TODAY.getFullYear();

        /****
         * [] fix a bug Jan converted to Athen
         * 
         * 
        */ // --> done



        function checkValues() {
            const gregorianDOB = document.getElementById('gregorianDOB').value;

            if (gregorianDOB.trim().split(' ').length < 3) 
                return;
            
            const date = new Date(gregorianDOB);
            if (isNaN(date.getTime()))
                return;

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let checkbox = document.getElementById('injectedCheckbox');
            
            if (month == 10 && day == 27 && year == 1982)
            {
                checkbox.checked = true;
                checkbox.disabled = false;
            }
            else
            {
                checkbox.checked = false;
                checkbox.disabled = true;
            }
        }

        function calculateAge() {
            const birthDate = document.getElementById('birthDate').value;
            const resultDiv = document.getElementById('result');

            if (!birthDate) {
                resultDiv.textContent = 'Please enter a birth date';
                return;
            }

            const arr = birthDate.trim().split(/\s+/);
            const m = getIndexFromElteMonth(arr[0]);

            if (m === -1 || arr.length < 3) {
                resultDiv.textContent = 'Please use the format "M11 1 current_year±N"';
                return;
            }

            const birthMonthName = MONTH_NAMES[m];     
            const birthYear = convertReversedCurrentYear(arr[2], m < 2);
            const convertedBirthDate = `${birthMonthName} ${arr[1]} ${birthYear}`;

            const TODAY = new Date();
            const birth = new Date(convertedBirthDate);
            if (isNaN(birth.getTime())) {
                resultDiv.textContent = 'Invalid birth date format';
                return;
            }

            let dayDiff = Math.floor((TODAY.getTime() - birth.getTime()) / (1000 * 60 * 60 * 24));
            let yearsOld = (dayDiff / DAYS_IN_A_YEAR).toFixed(2);
            let residuce = (yearsOld * 100) % 100;
            let flooredDownYearsOld = ((yearsOld * 100) - residuce) / 100; // Nov 27 1982

            resultDiv.textContent = `You are ${dayDiff.toLocaleString()} days old`;
            document.getElementById('reference').textContent = '~' + yearsOld + ' years old';
            document.getElementById('reference').textContent += '; the age is exactly ' + 
                                                                (residuce >= 70 ? flooredDownYearsOld + 1 : flooredDownYearsOld).toString() + ' yrs old';
        }

        function copyPASTE() {
            const gregorianDOB = document.getElementById('gregorianDOB').value;
            let decheck = document.getElementById('injectedCheckbox');
            let bFromDavid = false;

            bFromDavid = decheck.checked;
            document.getElementById('birthDate').value = convertToElte(gregorianDOB, bFromDavid);
        }

        function injectCheckbox(targetElementId) {
            const container = document.createElement('label');
            container.style.cssText = 'display: inline-flex; align-items: center; cursor: pointer; font-size: 13px; font-family: sans-serif; gap: 4px';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'injectedCheckbox';
            checkbox.style.cssText = 'cursor: pointer; width: 15px; height: 15px;';
            checkbox.disabled = true;

            const label = document.createElement('span');
            label.textContent = 'Do A Flip';

            // checkbox.addEventListener('change', (e) => {
            //     console.log(`Checkbox state: ${e.target.checked}`);
            // });

            container.appendChild(checkbox);
            container.appendChild(label);

            const target = document.getElementById(targetElementId) || document.body;
            target.appendChild(container);
        }

        window.onload = function() {
            injectCheckbox('D-label'); // Call the function to inject into document.body or a specific container ID
        }
    </script>

</body>
</html>
