<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lure ⇄ Rule</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #4b0082 0%, transparent 35%),
                radial-gradient(circle at bottom right, #00bfff 0%, transparent 35%),
                linear-gradient(135deg, #0f0c29, #302b63, #24243e);

            font-family: Arial, Helvetica, sans-serif;
        }

        /* MAIN SCENE */

        .scene {
            position: relative;
            width: 700px;
            height: 260px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* WORD */

        .word {
            position: relative;
            width: 520px;
            height: 120px;
        }

        /* LETTERS */


        /* FIXED LETTERS */

        .u {
            left: 220px;
            top: 0;
        }

        .r {
            left: 320px;
            top: 0;
        }

        .e {
            left: 420px;
            top: 0;
        }

        /*
    IMPORTANT:
    L and r are now ABSOLUTELY POSITIONED.
    They are no longer inside normal text flow.
    Therefore they can truly pass each other.
*/


        .morph-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 270px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 150px;
            font-weight: bold;
        }


        /* L ANIMATION */


        .letter-L {
            position: absolute;
            animation: morph 20s infinite alternate;
        }

        @keyframes morph {

            /* 0 to 40 seconds: Static L */
            0%
           {
            left:10px;

                transform:
                    rotateY(0deg) translateY(0px) scale(.8);
                opacity: 1;
            }

            /* 40 to 50 seconds: Scrunching down */
     
            12% {

                transform:
                    rotateY(180deg) translateY(40px) translateX(200px) scale(0.25);
                opacity: 0.75;
            }

        
            /* 50 seconds: The switch point */
            25% {

                transform:
                    rotateY(360deg) translateY(0px) translateX(100px) scale(0.14);
                opacity: 0.35;
            }

            /* 50.01% to 60%: Zooming out as lowercase l */
       
            37% {
                transform: translateX(220px) scale(0.02);
                opacity: 0.12;
            }

            48% {
                transform: scale(0.001);
                opacity: 0.01;
            }

            50% {
      
                transform:
                translateX(320px)
                    scale(2.2);
                opacity: .91;
            }

            /* the reverse */

            70% {
                transform: translateX(00px) scale(1);
                opacity: 0.9;
            }




            96%,
            100% {
                
                transform:
                    rotateY(0deg) translateY(0px) scale(1);
                opacity: 1;
            }

        }

        /* Using the ::after pseudo-element to handle the text swap */
        .letter-L::after {
            content: 'L';
            animation: textSwap 10s linear infinite alternate;
        }

        @keyframes textSwap {

            0%,
            50% {
                content: 'L';
            }

            51%,
            100% {
                content: 'r';
            }
        }

        /* r ANIMATION */
        .letter-R::before {
            content: "r";
            position: absolute;
            animation: rSwap 13s infinite;
        }

        @keyframes rSwap {

            0% {
                content: "r";
                left: 240px;
                transform:
                    rotateY(0deg) translateY(0px) scale(1);
            }

            25% {
                left: 120px;
                transform:
                    rotateY(-180deg) translateY(40px) scale(1.3);

                color: #00ffff;
            }

            50% {
                content: "R";
                left: 0;
                transform:
                    rotateY(-360deg) translateY(0px) scale(1);
            }

            75% {
                left: 120px;
                transform:
                    rotateY(-540deg) translateY(-40px) scale(1.3);

                color: #7CFC00;
            }

            100% {
                content: "r";
                left: 240px;
                transform:
                    rotateY(-720deg) translateY(0px) scale(1);
            }
        }

        /* FLOATING */

        .word {
            animation: floating 125s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* GLOW */

        .glow {
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(0, 255, 255, 0.15);

            filter: blur(60px);

            animation: pulse 41s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* PARTICLES */

        .particle {
            position: absolute;

            border-radius: 50%;

            background: white;

            pointer-events: none;

            animation: fly linear forwards;
        }

        @keyframes fly {

            from {
                transform:
                    translateY(0px) scale(1);

                opacity: 1;
            }

            to {
                transform:
                    translateY(-700px) scale(0);

                opacity: 0;
            }
        }


        /* TO MAKE IT SMOOTH TRANSFROMATION -- FROM GEMINI */
    </style>
</head>

<body>




    <div class="morph-container word">
        <span class="letter-L"></span>
        <span class="u">u</span>
        <span class="r">r</span>
        <span class="e">e</span>


    </div>



    <script>

        /* PARTICLES */

        function createParticle() {

            const p = document.createElement("div");

            p.className = "particle";

            const size = Math.random() * 8 + 2;

            p.style.width = size + "px";
            p.style.height = size + "px";

            p.style.left = Math.random() * window.innerWidth + "px";
            p.style.top = window.innerHeight + "px";

            p.style.animationDuration =
                (Math.random() * 410 + 132) + "s";

            document.body.appendChild(p);

            setTimeout(() => {
                p.remove();
            }, 197000);
        }

        setInterval(createParticle, 120);

    </script>

</body>

</html>
