<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lure ⇄ Rule</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at top left,#4b0082 0%,transparent 35%),
        radial-gradient(circle at bottom right,#00bfff 0%,transparent 35%),
        linear-gradient(135deg,#0f0c29,#302b63,#24243e);

    font-family:Arial, Helvetica, sans-serif;
}

/* MAIN SCENE */

.scene{
    position:relative;
    width:700px;
    height:260px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* WORD */

.word{
    position:relative;
    width:520px;
    height:120px;
}

/* LETTERS */

.letter{
    position:absolute;

    font-size:6rem;
    font-weight:900;

    color:white;

    text-shadow:
        0 0 10px #fff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;

    user-select:none;
}

/* FIXED LETTERS */

.char {
    font-size: 140px;

}

.u{
    left:120px;
    top:0;
}

.e{
    left:360px;
    top:0;
}

/*
    IMPORTANT:
    L and r are now ABSOLUTELY POSITIONED.
    They are no longer inside normal text flow.
    Therefore they can truly pass each other.
*/

.l{
    left:0;
    top:0;

    z-index:2;

    animation:lSwap 20s ease-in-out infinite;
}

.r{
    left:240px;
    top:0;

    z-index:1;

    animation:rSwap 20s ease-in-out infinite;
}

/* L ANIMATION */

@keyframes lSwap{

    0%{
        left:0;
        transform:
            rotateY(0deg)
            translateY(0px)
            scale(1);
    }

    25%{
        left:120px;
        transform:
            rotateY(180deg)
            translateY(-40px)
            scale(1.3);

        color:#ffd700;
    }

    50%{
        left:240px;
        transform:
            rotateY(360deg)
            translateY(0px)
            scale(1);
    }

    75%{
        left:120px;
        transform:
            rotateY(540deg)
            translateY(40px)
            scale(1.3);

        color:#ff77ff;
    }

    100%{
        left:0;
        transform:
            rotateY(720deg)
            translateY(0px)
            scale(1);
    }
}

/* r ANIMATION */

@keyframes rSwap{

    0%{
        left:240px;
        transform:
            rotateY(0deg)
            translateY(0px)
            scale(1);
    }

    25%{
        left:120px;
        transform:
            rotateY(-180deg)
            translateY(40px)
            scale(1.3);

        color:#00ffff;
    }

    50%{
        left:0;
        transform:
            rotateY(-360deg)
            translateY(0px)
            scale(1);
    }

    75%{
        left:120px;
        transform:
            rotateY(-540deg)
            translateY(-40px)
            scale(1.3);

        color:#7CFC00;
    }

    100%{
        left:240px;
        transform:
            rotateY(-720deg)
            translateY(0px)
            scale(1);
    }
}

/* FLOATING */

.word{
    animation:floating 125000000s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }
}

/* GLOW */

.glow{
    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    background:rgba(0,255,255,0.15);

    filter:blur(60px);

    animation:pulse 41s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:0.5;
    }

    50%{
        transform:scale(1.3);
        opacity:1;
    }
}

/* PARTICLES */

.particle{
    position:absolute;

    border-radius:50%;

    background:white;

    pointer-events:none;

    animation:fly linear forwards;
}

@keyframes fly{

    from{
        transform:
            translateY(0px)
            scale(1);

        opacity:1;
    }

    to{
        transform:
            translateY(-700px)
            scale(0);

        opacity:0;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="glow"></div>

    <div class="word">

        <span class="letter l char">L</span>
        <span class="letter u char">u</span>
        <span class="letter r char">R</span>
        <span class="letter e char">e</span>

    </div>

</div>

<script>

/* PARTICLES */

function createParticle(){

    const p = document.createElement("div");

    p.className = "particle";

    const size = Math.random() * 8 + 2;

    p.style.width = size + "px";
    p.style.height = size + "px";

    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = window.innerHeight + "px";

    p.style.animationDuration =
        (Math.random() * 410 + 132) + "s";

    document.body.appendChild(p);

    setTimeout(() => {
        p.remove();
    }, 197000);
}

setInterval(createParticle, 120);

</script>

</body>
</html>
