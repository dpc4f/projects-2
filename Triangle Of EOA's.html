<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>supreme conqueror's kin' E w/ starcraft</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            overflow: hidden;
       
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            left: 800px;
            color: rgba(212, 160, 160, 0.877);
            font-size: 24px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
        }

        .note-top-right, .note-top-right-2 {
            font-size: 17px;
            color: darkgreen;
            position: absolute;
            top: 10px;
            left: 1600px;
        }

        .note-top-right-2 {
            top: 140px;
        }

        .invisible, .hidden {
            display: none
        }
    </style>
</head>

<body>
    <canvas id="diyCanvas"></canvas>
    <div class="instruction">EOA, Eliteness Of Axes</div>
    <div class="note-top-right">
        [ı, no-dot i][a taxonomy]<br/>
        AıO, All In One --> a/o, aıo<br/>
    </div>
    <div class="invisible">MS Word cannot convert ı to become, uppercase-dotless-ı</div>
    <div class="hidden">DE, Dec (December) ðɪ Excellence</div>
    <div class="note-top-right-2">
        [D [Deustch], G [Germany]]<br/>
        { Gau Me, Duc Mix }
    </div>

    <script>
        const canvas = document.getElementById('diyCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fit window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Colour definitions
        const colors = {
            D: '#FFBF00', // Amber
            I: '#50C878', // Emerald
            Y: '#4B0082'  // Opaced Indigo
        };

        // Animation and interaction state
        let angle = 0;
        let targetRotationSpeed = 0.015;
        let currentRotationSpeed = 0.105;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let particles = [];

        // Particle Class for sophisticated ambient effects
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 6;
                this.speedX = (Math.random() - 0.5) * 1.15;
                this.speedY = (Math.random() - 0.5) * 1.35;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Mouse interactions
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            targetRotationSpeed = 0;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            angle += deltaX * 0.01;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            targetRotationSpeed = 0.005; // Return to slow spin
        });

        // Main Animation Loop
        function animate() {
            // Clear screen with a slight trail effect for smoothness
            ctx.fillStyle = 'rgba(11, 12, 16, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Interpolate rotation speed smoothly
            currentRotationSpeed += (targetRotationSpeed - currentRotationSpeed) * 0.05;
            if (!isDragging)
                angle -= currentRotationSpeed;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.38;

            // Calculate Vertex Positions in 2D space
            const vertices = [
                { label: 'A', color: colors.D, x: centerX + radius * Math.cos(angle), y: centerY + radius * Math.sin(angle) },
                { label: 'E', color: colors.I, x: centerX + radius * Math.cos(angle + (2 * Math.PI / 3)), y: centerY + radius * Math.sin(angle + (2 * Math.PI / 3)) },
                { label: 'O', color: colors.Y, x: centerX + radius * Math.cos(angle + (4 * Math.PI / 3)), y: centerY + radius * Math.sin(angle + (4 * Math.PI / 3)) }
            ];

            // 1. Emit Particles from vertices
            vertices.forEach(v => {
                if (Math.random() < 0.4)
                    particles.push(new Particle(v.x, v.y, v.color));
            });

            // Update and draw particles
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 2. Draw sophisticated blended glow gradients inside the triangle
            // We use multiple overlapping gradients to simulate multi-color vertex blending
            vertices.forEach((v, index) => {
                const nextV = vertices[(index + 1) % 3];
                const grad = ctx.createLinearGradient(v.x, v.y, nextV.x, nextV.y);
                grad.addColorStop(0, v.color);
                grad.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.moveTo(vertices[0].x, vertices[0].y);
                ctx.lineTo(vertices[1].x, vertices[1].y);
                ctx.lineTo(vertices[2].x, vertices[2].y);
                ctx.closePath();

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            });

            // 3. Draw outer elegant white stroke line
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            ctx.lineTo(vertices[1].x, vertices[1].y);
            ctx.lineTo(vertices[2].x, vertices[2].y);
            ctx.closePath();
            ctx.stroke();

            // 4. Draw sophisticated node typography and glowing vertices
            vertices.forEach(v => {
                // Outer glow aura for vertex
                ctx.save();
                ctx.shadowBlur = 30;
                ctx.shadowColor = v.color;
                ctx.fillStyle = v.color;
                ctx.beginPath();
                ctx.arc(v.x, v.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Core inner white dot
                // ctx.fillStyle = '#ffffff';
                // ctx.beginPath();
                // ctx.arc(v.x, v.y, 2, 0, Math.PI * 2);
                // ctx.fill();

                // Label Typography
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 34px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Offset labels slightly outwards from center
                const offsetFactor = 1.25;
                const labelX = centerX + (v.x - centerX) * offsetFactor;
                const labelY = centerY + (v.y - centerY) * offsetFactor;

                // Subtle text shadow for the letters
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(v.label, labelX, labelY);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        // Kick off the loop
        animate();
    </script>

</body>
</html>
