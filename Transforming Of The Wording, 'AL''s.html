<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{ time, AL } [in 'et al']</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: left;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #2c3e50);
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            font-size: 70px;
            letter-spacing: 6px;
            display: flex;
            align-items: left;
            margin-left: 400px;
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px) scale(1.8);
            transition: all 0.5s ease;
            color: #ccc;
            margin-right: 20px;
        }

        .letter.show {
            opacity: 1;
            transform: scale(1.8);
        }

        .letter.exit {
            opacity: 0;
            transform: translateY(-30px) scale(0.8);
        }

        /* ✨ Anchor letter 'a' */
        .anchor {
            /* opacity: 1 !important;
            transform: none !important; */
            color: purple;
            /* text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
             font-size: 94px;
            margin-left: 60px; */
        }

        .b-character {
            margin-left: -67px;
        }

        .l-character {
            font-weight: bold;
        }

        /* 🎨 Color palette for other letters */
        .c0 {
            color: #4153f9;
        }

        .c1 {
            color: #df3d14;
        }

        .c2 {
            color: #3d31e7;
        }

        .c3 {
            color: #d7df64;
        }

        .c4 {
            color: #f4c990;
        }

        .c5 {
            color: #97aeb8;
        }

        .c6 {
            color: #25cccc;
        }

        .c7 {
            color: #81b29a;
        }

        .c8 {
            color: #f4f800;
        }

        .c9 {
            color: #3d5b42;
        }

        .font-time {
            font-size: 40px;
            align-self: flex-center;
            align-content: center;
        }

        .hidden, .invisible {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container" id="word"></div>
    <div class="hidden">chư Phật tam thời, { generally there are only eight Big BUDDHAs of all time }</div>

    <script>
        const steps = ["al", "ar", "bar", "ba", "ba, time"];
        const container = document.getElementById("word");
        let currentIndex = 0;
        const colors = ["c0", "c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8", "c9"]; // soft colour rotation
        let colorIndex = -1;

        function getColor(coChar) {
            switch (coChar) {
                case "a":
                    break;

                case "l":
                    colorIndex = 2;
                    break;

                case "r":
                    colorIndex = 3;
                    break;

                case "b":
                    colorIndex = 4;
                    break;

                case "e":
                    colorIndex = 5;
                    break;

                case "t":
                    colorIndex = 6;
                    break;

                case "i":
                    colorIndex = 7;
                    break;

                case "3":
                    colorIndex = 8;
                    break;

                case "{":   
                case "}":
                    colorIndex = 9;
                    break;

                default:
                    colorIndex = 0;
                    break;
            }

            return colors[++colorIndex % colors.length];;
        }

        // Render word
        function renderWord(curWord, word) { // word is next word to be rendered
            container.innerHTML = "";
            word.split("").forEach((char, i) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.classList.add("letter");

                if (char === "a") {
                    // span.classList.add("anchor");
                    // span.classList.add("l-character");
                    span.classList.add("show");
                    span.classList.add("anchor");
                } else {
                    span.classList.add(getColor(char));
                }

                if (char === 'b')
                    span.classList.add("b-character");

                if (char === 'l')
                    span.classList.add("l-character");

                if (char === "t" || char === "i" || char === "m" || char === "e")
                    span.classList.add("font-time");

                if (char !== "a") {
                    if (curWord.includes(char)) {
                        //setTimeout(() => {
                            span.classList.add("show");
                        //}, i * 10);
                    } else {
                        setTimeout(() => {
                            span.classList.add("show");
                        }, (i+1) * 420);
                    }
                }

                container.appendChild(span);
            });
        }

        let duration = 0;
        let bExit = true;
        let bExtended = false;
        
        function transitionTo(nextWord) { // Transition
            let oldLetters = container.querySelectorAll(".letter");
            let currentWord = '';

            oldLetters.forEach((letter, i) => {
                currentWord += letter.textContent;
                
                let duration;
                if (!letter.classList.contains("anchor")) {
                    duration = 0; // default exit duration
                    
                    if (nextWord.includes(letter.textContent))
                        duration = 2200; // extend duration for letters that will be reused

                    setTimeout(() => {
                        letter.classList.add("exit");
                    }, i * 80 + duration); // stagger exit with a base delay and additional duration for reused letters
                }
            });


            if (nextWord === "ba, { 3, time }")
                duration = 500; // Special case; cause it to display longer
            else
                duration = 1100;

            setTimeout(() => {
                renderWord(currentWord, nextWord);
            }, duration); // wait a duration 4b doing presentation the next wording
        }

        // Loop
        function startAnimation() {
            let curWord= steps[currentIndex];
            
            renderWord('', curWord);
            setInterval(() => {
                curWord = steps[currentIndex];
                currentIndex = (currentIndex + 1) % steps.length;
                transitionTo(steps[currentIndex]);
            }, 12700);
        }

        startAnimation();
    </script>

</body>
</html>
