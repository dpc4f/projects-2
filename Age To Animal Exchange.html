<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age To Animal Exchange</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background: #f9f9f9;
            width: 50%;
            margin: auto;
            margin-top: 100px;
        }

        .buttonCalculate {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .buttonCalculate:hover {
            background: #764ba2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 18px;
        }

        h2 {
            margin: 5px 0;
            font-size: 18px;
        }

        .center {
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 480px;
            margin: auto;
            margin-top: 140px;
        }

        .inputElte {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            margin-bottom: 40px;
        }

        #reference {
            font-size: 17px;
        }

        #gregorianDOB {
            position: relative;
        }

        .convertToElte {
            left: 200px;
            position: relative;
            text-align: center;
            font-size: 27px;
            margin: 20px;         
        }

        .center {
            text-align: center;
            color: honeydew;
            background-color: green;
        }
    </style>
</head>

<body>
    <h1 class="center">Exchange To Animals</h1>
    <input type="text" id="gregorianDOB" placeholder="Dec 13 2011">
    <button class="inputElte" onclick="copypaste2BirthYear(document.getElementById('gregorianDOB').value)">COPYpaste</button>
    <input type="text" id="birthYear" value="current_year, 2020" disabled>
    <input id="birthYear-2" value="">
    <button class="inputElte" onclick="fromElte()">COPYpaste From Elte</button>
    <input id="animal" disabled value="">

    <script>

        /***
        * [] re-write this application using functions instead of constant arrays
        * 
        *  
        * */ // --> done

        const CURRENT_YEAR = 2020;
        const TODAY = new Date();
        const DAYS_IN_YEAR = 365.25;

        // { dragon; Dragon }, 'Lý Dần' ð Snake */ /* Reindeer <> Goat

        let currentMonth = TODAY.getMonth();
        let currentYear = TODAY.getFullYear();

        function getAnimal(idx) {
            let ret = '';

            switch (idx) 
            {
                case 0:
                    ret = "Mouse / Rat / Capybara";
                    break;
                case 1:
                    ret = "Ox / Bull / Buffalo / Cow";
                    break;
                case 2:
                    ret = "Tiger / Leopard";
                    break;
                case 3:
                    ret = "Rabbit / Rapoo ð Computer Mouse";
                    break;
                case 4:
                    ret = "Long-dragon / Ant / Bee / Peacock";
                    break;
                case 5:
                    ret = "Snake Clan / Centipede";
                    break;
                case 6:
                    ret = "Horse / Sea-horse / Dragon";
                    break;
                case 7:
                    ret = "ma-Goat / Gorilla";
                    break;
                case 8:
                    ret = "Monkey / Ape";
                    break;
                case 9:
                    ret = "Rooster / Hen";
                    break;
                case 10:
                    ret = "Dodge / Deer / Reindeer / Duck";
                    break;
                case 11:
                    break;
                    ret = "Pig / Boar in ð Wilderness / Bear";
                default:
                    break;
            }

            return ret;
        }

        function getMonth(month, bLongForm = true) {
            let ret = '';

            switch (month.toString()) {
                case '0':
                    ret = bLongForm ? 'Athen' : 'a';
                    break;
                
                case '1':
                    ret = bLongForm ? 'Duo' : 'd';
                    break;

                case '2':
                    ret = bLongForm ? 'Magha' : 'm';
                    break;
                
                case '3':
                    ret = bLongForm ? 'Qaru' : 'q';
                    break;

                case '4':
                    ret = bLongForm ? 'Felle' : 'f';
                    break;
                
                case '5':
                    ret = bLongForm ? 'Yune' : 'y';
                    break;

                case '6':
                    ret = bLongForm ? 'SEPT' : 's';
                    break;
                
                case '7':
                    ret = bLongForm ? 'OCT' : 'o';
                    break;

                case '8':
                    ret = bLongForm ? 'NOV' : 'n';
                    break;
                
                case '9':
                    ret = bLongForm ? 'DEC' : 'd';
                    break;

                case '10':
                    ret = bLongForm ? 'Palm' : 'p';
                    break;
                
                case '11':
                    ret = bLongForm ? 'Hose' : 'h';
                    break;

                default:
                    break;
            }

            return ret;
        }

        function convertCurrentYear() {
            let subtract = currentYear - CURRENT_YEAR;
            return 'current_year+' + subtract.toString();
        }

        function convertReversedCurrentYear(yearStr) {
            const match = yearStr.match(/^current_year([+-]\d+)$/);
            return CURRENT_YEAR + Number(match?.[1] ?? 0);
        }

        function convertToElte(aDate) {
            let date = '';
            date = aDate !== '' && aDate !== undefined ? new Date(aDate) : new Date();

            if (isNaN(date.getTime())) {
                alert("Invalid date format. Please use a format like 'Dec 13 2011'.");
                return;
            }

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let elteMonth = getMonth(month < 2 ? month+10 : month-2);
            let elteYear;
            let elteDOB;

            if (month < 2) // month is Jan OR Feb
                year--;
            if (year > CURRENT_YEAR)
                elteYear = 'current_year+' + (year - CURRENT_YEAR).toString();
            else if (year < CURRENT_YEAR)
                elteYear = 'current_year-' + (CURRENT_YEAR - year).toString();
            else
                elteYear = 'current_year';
            elteDOB = `${elteMonth} ${day} ${elteYear}`;

            return elteDOB;
        }

        window.onload = function() {
            document.getElementById('birthYear-2').value = convertToElte(new Date());
            fromElte();
        }
        
        function copypaste2BirthYear(aDate)
        {
            document.getElementById('birthYear-2').value = convertToElte(new Date(aDate));
        }
        
        function fromElte() {
            /***
             * [] revise this function 
             * 
             * */ // --> done

            const elteDOB = document.getElementById('birthYear-2').value;
            const arr = elteDOB.trim().split(/\s+/);
            const m = getMonth(arr[0]);

            if (m === -1 || arr.length < 3) {
                alert('Please use the format "M1 27 current_year+6"');
                return;
            }

            const birthYear = convertReversedCurrentYear(arr[2]);
            exchange2Animal(birthYear);
        }

        function exchange2Animal(birthYear) {
            while (birthYear < CURRENT_YEAR)
                birthYear += 12;

            document.getElementById('animal').value = getAnimal((birthYear - CURRENT_YEAR) % 12);
        }
    </script>

</body>
</html>
