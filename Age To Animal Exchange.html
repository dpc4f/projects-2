<head>

    <style>

<body>
    <h1 class="center">Exchange To Animals</h1>
    <input type="text" id="gregorianDOB" placeholder="Dec 13 2011">
    <button class="inputElte" onclick="copypaste2BirthYear(document.getElementById('gregorianDOB').value)">COPYpaste</button>
    <input type="text" id="birthYear" value="current_year, 2020" disabled>
    <input id="birthYear-2" value="">
    <button class="inputElte" onclick="fromElte()">COPYpaste From Elte</button>
    <input id="animal" disabled value="">

    <script>
        const CURRENT_YEAR = 2020;
        const TODAY = new Date();
        const DAYS_IN_YEAR = 365.25;
        const MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const MONTH_NAMES_2 = [
            "Athen", "Duo", "Magha", "Qaru", "Felle", "Yune",
            "SEPT", "OCT", "NOV", "DEC", "Palm", "Hose"
        ]; // Athen is a goddess, wife of Zeus

        const ANIMAL_NAMES = [
            "Mouse / Rat / Capybara / Guinea Pig", "Ox / Bull / Buffalo / Cow", 
            "Tiger / Leopard", "Rabbit / Rapoo ð Electric Mouse", "Long Dragon / Ant / Bee / Peacock", "Snake Family / Centipede",
            "Horse / Sea-horse / Sea-dragon", "Goat / Maggot", "Monkey / Ape / Kong", 
            "Rooster / Chicken / Hen", "Dodge / Deer / Reindeer / Duck", "Pig / Boar in ð Wilderness / Bear"
        ]; /* { dragon; Dragon }, 'Lý Dần' ð Snake */ /* Reindeer <> Goat */

        let currentMonth = TODAY.getMonth();
        let currentYear = TODAY.getFullYear();

        function convertCurrentYear() {
            let subtract = currentYear - CURRENT_YEAR;
            return 'current_year+' + subtract.toString();
        }

        function convertReversedCurrentYear(yearStr) {
            const match = yearStr.match(/^current_year([+-]\d+)$/);
            return CURRENT_YEAR + Number(match?.[1] ?? 0);
        }

        function toTuesdayFirst(day) {
            return (day + 5) % 7;
        }

        function renderCalendar(year, month) {
            const firstDay = new Date(year, month, 1);
            const startIndex = toTuesdayFirst(firstDay.getDay());
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const body = document.getElementById("calendarBody");
            let date = 1;

            document.getElementById("monthYear").textContent = MONTH_NAMES_2[month] + " " + convertCurrentYear(year);  
            body.innerHTML = "";

            for (let r = 0; r < 6; r++) {
                const row = document.createElement("tr");

                for (let c = 0; c < 7; c++) {
                    const cell = document.createElement("td");

                    if (r === 0 && c < startIndex || date > daysInMonth)
                        cell.textContent = "";
                    else {
                        cell.textContent = date;

                        if (
                            date === TODAY.getDate() &&
                            month === TODAY.getMonth() &&
                            year === TODAY.getFullYear()
                        ) {
                            cell.classList.add("TODAY");
                        }

                        date++;
                    }

                    row.appendChild(cell);
                }

                body.appendChild(row);
                if (date > daysInMonth) break;
            }
        }

        function changeMonth(step) {
            currentMonth += step;

            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }

            renderCalendar(currentYear, currentMonth);
        }

        function convertToElte(aDate) {
            let date = '';
            date = aDate !== '' && aDate !== undefined ? new Date(aDate) : new Date();

            if (isNaN(date.getTime())) {
                alert("Invalid date format. Please use a format like 'Dec 13 2011'.");
                return;
            }

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let elteMonth = MONTH_NAMES_2[month < 2 ? month+10 : month-2];
            let elteYear;
            let elteDOB;

            if (month < 2) // month is Jan OR Feb
                year--;
            if (year > CURRENT_YEAR)
                elteYear = 'current_year+' + (year - CURRENT_YEAR).toString();
            else if (year < CURRENT_YEAR)
                elteYear = 'current_year-' + (CURRENT_YEAR - year).toString();
            else
                elteYear = 'current_year';
            elteDOB = `${elteMonth} ${day} ${elteYear}`;

            return elteDOB;
        }

        window.onload = function() {
            document.getElementById('birthYear-2').value = convertToElte(new Date());
            fromElte();
        }
        
        function copypaste2BirthYear(aDate)
        {
            document.getElementById('birthYear-2').value = convertToElte(new Date(aDate));
        }
        
        function fromElte() {
            /***
             * [] revise this function 
             * 
             * */ // --> done

            const elteDOB = document.getElementById('birthYear-2').value;
            const arr = elteDOB.trim().split(/\s+/);
            const m = MONTH_NAMES_2.indexOf(arr[0]);

            if (m === -1 || arr.length < 3) {
                alert('Please use the format "M1 27 current_year+6"');
                return;
            }

            const birthMonthName = MONTH_NAMES[m];
            const birthYear = convertReversedCurrentYear(arr[2]);
            const convertedBirthDate = `${birthMonthName} ${arr[1]} ${birthYear}`;

            // document.getElementById('birthYear-2').value = birthYear;
            exchange2Animal(birthYear);
        }

        function exchange2Animal(birthYear) {
            while (birthYear < CURRENT_YEAR)
                birthYear += 12;

            document.getElementById('animal').value = ANIMAL_NAMES[(birthYear - CURRENT_YEAR) % 12];
        }
    </script>

</body>
</html>
