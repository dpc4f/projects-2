        function copypaste2BirthYear(gregorianDOB)
        {
            const aDate = new Date(gregorianDOB);
            let month = aDate.getMonth();
            let day = aDate.getDate();
            let year = DateValues.getYearNumberOnly(aDate);
            
            if (month == 10 && day == 27 && year == 1982)

            document.getElementById('birthYear-2').value = DateValues.convertToElteDate(gregorianDOB, bFromDavid);

            const elteDOB = document.getElementById('birthYear-2').value.trim();
            const [birthMonth, birthYear] = UnytValues.revertElteMonthYear(elteDOB);

            if (birthMonth === -1 || elteDOB.split(/\s+/).length < 3) {
                alert('Please use the format "M1 27 current_year+6"');
                return;
            }

            document.getElementById('animal').value = VoCuc.exchange2AnimalByLunar(bFromDavid ? birthYear - 2 : birthYear);
        }

        function fromElte() {
            doCalculation(true);
        }

        function checkValues() {
            const gregorianDOB = document.getElementById('gregorianDOB').value;
            const davidButton = document.getElementById('fromDavis');

            if (gregorianDOB.trim().split(' ').length < 3) 
                return;
            
            const date = new Date(gregorianDOB);
            if (isNaN(date.getTime()))
                return;

            let month = date.getMonth();
            let day = date.getDate();
            let year = date.getFullYear();
            let checkbox = document.getElementById('injectedCheckbox');
