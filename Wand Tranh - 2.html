        function exportText() {
            var text = document.getElementById("htmlSource").value;
            var blob = new Blob([text], { type: "text/plain" });
            var link = document.createElement("a");

            link.href = URL.createObjectURL(blob);
            link.download = "wand tranh's note.tex";
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
        }

        let myHtmlString = localStorage.getItem("davios_rows");
        const $output = document.getElementById('Note-1');
        window.onload = () => {
            const $htmlSource = document.getElementById('htmlSource');
            $htmlSource.value = formatHTML(myHtmlString);
        };

        function formatHTML(htmlString, indentSize = 4) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            function formatNode(node, level = 0) {
                const indent = ' '.repeat(level * indentSize);
                let output = '';

                for (const child of node.childNodes) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        const tagName = child.tagName.toLowerCase();
                        const attrs = Array.from(child.attributes)
                            .map(a => ` ${a.name}="${a.value}"`)
                            .join('');

                        // Self-closing / void elements (e.g. <img>, <br>, <input>)
                        const isVoid = /^(img|br|hr|input|meta|link)$/i.test(tagName);

                        if (isVoid) {
                            output += `${indent}<${tagName}${attrs} />\n`;
                        } else if (child.childNodes.length === 1 && child.firstChild.nodeType === Node.TEXT_NODE) {
                            // Keep short text nodes on a single line
                            output += `${indent}<${tagName}${attrs}>${child.textContent.trim()}</${tagName}>\n`;
                        } else {
                            output += `${indent}<${tagName}${attrs}>\n`;
                            output += formatNode(child, level + 1);
                            output += `${indent}</${tagName}>\n`;
                        }
                    } else if (child.nodeType === Node.TEXT_NODE) {
                        const text = child.textContent.trim();
                        if (text) {
                            output += `${indent}${text}\n`;
                        }
                    }
                }
                return output;
            }

            return formatNode(doc.body).trim();
        }

        // Usage Example:
        const rawHtml = '<div><ul><li>Item 1</li><li>Item 2</li></ul></div>';
        console.log(formatHTML(rawHtml));


        function renderDomTree(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent.trim();
                return text ? document.createTextNode(text) : null;
            }

            if (node.nodeType === Node.ELEMENT_NODE) {
                const details = document.createElement('details');
                details.open = true;

                const summary = document.createElement('summary');
                summary.style.fontFamily = 'monospace';
                summary.innerHTML = `<b style="color:#000080">&lt;${node.tagName.toLowerCase()}&gt;</b>`;
                details.appendChild(summary);

                const container = document.createElement('div');
                container.style.paddingLeft = '20px';

                Array.from(node.childNodes).forEach(child => {
                    const childEl = renderDomTree(child);
                    if (childEl) container.appendChild(childEl);
                });

                details.appendChild(container);
                return details;
            }
            return null;
        }

        // Usage:
        const parser = new DOMParser();
