<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elte Calendar w/ Platon Time</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            background: #f9f9f9;
        }

        .calendar-container {
            max-width: 780px;
            margin: auto;
            margin-top: 100px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: 10px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        button {
            padding: 6px 10px;
            font-size: 36px;
            border: none;
            border-radius: 6px;
            background: darkgoldenrod;
            color: lightblue;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .buttonCalculate {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .buttonCalculate:hover {
            background: #764ba2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 18px;
        }

        h2 {
            margin: 5px 0;
            font-size: 18px;
        }

        .center {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th,
        td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 6px 0;
            font-size: 24px;
            width: 14.28%;
            color: darkgoldenrod;
        }

        th {
            background: #f0f0f0;
        }

        td {
            height: 40px;
        }

        .TODAY {
            background: lightblue;
            border-radius: 0%;
            font-weight: bold;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-top: 200px;

        }

        #monthYear {
            color: darkgoldenrod;
        }

        #reference {

            font-size: 12px;

        }

        /* Mobile optimization */
        @media (max-width: 580px) {

            th,
            td {
                font-size: 12px;
                padding: 4px 0;
                height: 34px;
            }

            button {
                font-size: 14px;
                padding: 5px 8px;
            }
        }

        .flex-container {
            display: flex;
            max-height: 100vh;
            /* optional: full viewport height */
            width: auto;
            margin-top: 40px;
        }



        .flex-months,
        .left-panel,
        .right-panel {

            /* each side takes equal width */
            padding: 10px;
            background: #f2f2f2;
        }

        .flex-months {
            flex: 0 0 10%;
            padding-top: 120px;
            justify-content: center;
            align-items: center;
        }

        .month {
            font: bold 31px "Arial", monospace;
            color: brown;
        }



        .left-panel {
            flex: 1 0 50%;
            /* fixed 300px width */
        }

        .right-panel {
            flex: 2;
            /* fills remaining space */
            padding: 20px;
        }

        .platon-time {
            width: auto;
            margin-bottom: 10px;
            font-size: 19px;
        }

        /* 1. Define the color-switching animation */
        @keyframes colorSwitch {
            0%, 100% {
                color: #23bb9a; /* Start & End color (e.g., Blue) */
            }
            50% {
                color: #050c49; /* Middle color (e.g., Red) */
            }
        }

        .local-current-time
        {
            width: auto;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            margin-bottom: 80px;
        }

        .dacet-pine {
            /* 
                - 3s: total duration of one cycle (blue -> red -> blue)
                - ease-in-out: makes the transition smooth
                - infinite: keeps repeating endlessy
            */
            animation: colorSwitch 23s ease-in-out infinite;
        }

        .old-db-record {
            color: lightblue;
        }

        .excellent {
            font-weight: 900;
            font-size: 15px;
        }

        .excellent-def {
            font: bold 16px "Arial", monospace;
            color: green
        }

        em {
            font-size: large;
            font-weight: 900;
            margin-right: 22px;
        }

        .forestry {
            font-size: 27px;
        }

        .forestry-b {
            font-size: 27px;
            margin-right: 7px;
        }

        .Pali {
            font-size: 17px;
        }

        .raining-season {
            color: #1ad123e8;
        }

        .dry-season {
            color: orange; /* I don't like hot weather */
        }

        .faded-tomato {
            color: #D46A6A;
            font-weight: bold;
        }

        .city {
            font-size: 26px;
            font-weight: 900;
     
        }

        .note {
            font-size: 17px;
            color: darkgreen;
            margin-left: 483px;
            margin-top: 14px;
        }

    </style>
</head>

<body>
    <div class="flex-container">
        <div class="flex-months month" id="monthNames">
            <div class="center dry-season">Athen</div>
            <div class="center dry-season">Duo</div>
            <div class="center dry-season">Magha</div>
            <div class="center raining-season">Qaru</div>
            <div class="center raining-season">Felle</div>
            <div class="center raining-season">Yune</div>
            <div class="center raining-season">SEPT</div>
            <div class="center raining-season">OCT</div>
            <div class="center raining-season">NOV</div>
            <div class="center dry-season">DEC</div>
            <div class="center dry-season">Palm</div>
            <div class="center dry-season">Hose</div>
        </div>

        <div class="left-panel">
            <div class="calendar-container">
                <h1 class="center" id="monthYear"></h1>
                <table>
                    <thead>
                        <tr>
                            <th>Thaw</th>
                            <th>Wan</th>
                            <th>U<span class="faded-tomato">t</span>h</th>
                            <th>Fri</th>
                            <th>Sat</th>
                            <th>Hie</th>
                            <th>Dak</th>
                        </tr>
                    </thead>
                    <tbody id="calendarBody"></tbody>
                </table>
                <div class="note">days have a peer-to-peer relationship</div>
                <div class="note">Xử Nữ. Song Tử. Bọ Cạp. Aquarius.
                </div>
                <div class="nav">
                    <button onclick="changeMonth(-1)">Prev Month</button>
                    <button onclick="changeMonth(1)">Next Month</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="platon-time">
                <em class="city">Galway</em>
                <span class="excellent">GMT+7</span>-6
            </div>
            <div id="narana" class="local-current-time"></div>

            <div class="platon-time old-db-record">
                <em class="forestry">서울</em><em class="city">Kyoto</em>
                <span class="excellent">GMT+7</span>+2
            </div>
            <div id="oxaka-seoul" class="local-current-time"></div>

            <div class="platon-time">
                <em class="forestry-b">北京</em>
                <em>== madrid+6</em>
                <em class="city">Madrid</em>
                <span class="excellent">GMT+7</span>-5
            </div>
            <div id="beijing" class="local-current-time"></div>

            <div class="platon-time">
                <em class="city">Matxkva</em>
                <span class="excellent">GMT+7</span>+8
            </div>
            <div id="dmitry" class="local-current-time"></div>

            <div class="platon-time">
                <em class="city">Dacet</em>
                <span class="excellent-def">GMT+7</span>
            </div>
            <div id="dustin-plural" class="local-current-time dacet-pine"></div>
        </div>
    </div>
 
    <script>
        const CURRENT_YEAR = 2020;
        const TODAY = new Date();
        const DAYS_IN_YEAR = 365.25;
        const MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        const MONTH_NAMES_2 = [
            "Athen", "Duo", "Magha", "Qaru", "Felle", "Yune",
            "SEPT", "OCT", "NOV", "DEC", "Palm", "Hose"
        ]; // Athen is { Infanta Sofía, a goddess }, wife of Zeus

        let currentMonth = TODAY.getMonth();
        let currentYear = TODAY.getFullYear();


        function formatTime(date, hours = 0) {
            let hr;
            const h = String((hr = date.getHours() + hours) >= 0 ? hr : 24 + hr).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function updateTimes() {
            const ExcellenT = new Date();
            let oxakaSeoulTime = formatTime(ExcellenT, additionalHours = 2); // GMT+7+2
            let beijingTime = formatTime(ExcellenT, additionalHours = -5); // GMT+7+1 --> GMT+7-5
            let rainingTime = formatTime(ExcellenT, additionalHours = -6); // GMT+7-6
            let dacetTime = formatTime(ExcellenT, additionalHours = 0); // GMT+7
            let dimitryTime = formatTime(ExcellenT, additionalHours = 8); // GMT+7+8

            document.getElementById('oxaka-seoul').textContent = `${oxakaSeoulTime}`;
            document.getElementById('beijing').textContent = `${beijingTime}`;
            document.getElementById('narana').textContent = `${rainingTime}`;
            document.getElementById('dustin-plural').textContent = `${dacetTime}`;
            document.getElementById('dmitry').textContent = `${dimitryTime}`;
        }

        // initial render
        updateTimes();

        // refresh every second
        setInterval(updateTimes, 1000);

        function convertCurrentYear() {
            let subtract = currentYear - CURRENT_YEAR;
            return 'current_year+' + subtract.toString();
        }

        function convertReversedCurrentYear(yearStr) {
            const match = yearStr.match(/^current_year([+-]\d+)$/);
            return CURRENT_YEAR + Number(match?.[1] ?? 0);
        }

        function toTuesdayFirst(day) {
            return (day + 5) % 7;
        }

        function removePurple4Months() {
            let mt = document.getElementById("monthNames").children;
            let i = 0;
            for (; i<mt.length; i++) {
                mt[i].style.color = "";
            } // remove Purple the current month colour
        }

        function renderCalendar(year, month) {
            document.getElementById("monthYear").textContent =
                MONTH_NAMES_2[month < 2 ? month + 10 : month - 2] + " " + convertCurrentYear(year);

            let mt = document.getElementById("monthNames").children;

            removePurple4Months();

            mt[month < 2 ? month + 10 : month - 2].style.color = "purple";
            
            const firstDay = new Date(year, month, 1);
            const startIndex = toTuesdayFirst(firstDay.getDay());
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const body = document.getElementById("calendarBody");
            body.innerHTML = "";

            let date = 1;

            for (let r = 0; r < 6; r++) { 
                /* 
                    the first row (row zero) is 4 displaying Name of Days in a Week
                    có đúng 7 ngày trong tuần 'N' phải nhỏ hơn 5 tuần
                */
                
                const row = document.createElement("tr");
                for (let c = 0; c < 7; c++) {
                    const cell = document.createElement("td");

                    if (r === 0 && c < startIndex || date > daysInMonth) {
                        cell.textContent = "";
                    } else {
                        cell.textContent = date;

                        if (date === TODAY.getDate() && month === TODAY.getMonth() && year === TODAY.getFullYear())
                            cell.classList.add("TODAY");
                        
                        date++;
                    }
                    row.appendChild(cell);
                }

                body.appendChild(row);
                if (date > daysInMonth) break;
            }
           
        }

        function changeMonth(step) {
            currentMonth += step;

            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }

            renderCalendar(currentYear, currentMonth);
        }

        renderCalendar(currentYear, currentMonth);
    </script>

</body>
</html>
